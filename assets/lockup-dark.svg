<svg width="480" height="120" viewBox="0 0 480 120" xmlns="http://www.w3.org/2000/svg">
  <title>takeit wordmark with mascot — dark theme</title>

  <!-- Mascot, idle pose. Body lifted to a lighter violet for dark-mode
       contrast; ink (outlines, eyes, smile, wordmark) inverted to cream;
       tape softened so it doesn't disappear into the body; coral cheeks
       unchanged (coral reads on both). -->
  <g transform="translate(60 60)">
    <ellipse cx="0" cy="44" rx="38" ry="4" fill="#F4F1EC" opacity="0.10"/>
    <g transform="translate(-36 -36)">
      <path d="M 4 4 Q 4 0 8 0 L 64 0 Q 68 0 68 4 L 72 68 Q 72 72 68 72 L 4 72 Q 0 72 0 68 Z" fill="#8B6FFF"/>
      <path d="M 4 4 Q 4 0 8 0 L 64 0 Q 68 0 68 4 L 72 68 Q 72 72 68 72 L 4 72 Q 0 72 0 68 Z" fill="none" stroke="#F4F1EC" stroke-width="2"/>
      <rect x="32" y="0" width="10" height="72" fill="#6045D9"/>
      <rect x="0" y="26" width="72" height="8" fill="#6045D9"/>
      <ellipse cx="20" cy="48" rx="5.5" ry="3.5" fill="#FF8A6B"/>
      <ellipse cx="54" cy="48" rx="5.5" ry="3.5" fill="#FF8A6B"/>
      <ellipse cx="23" cy="42" rx="2.8" ry="3.5" fill="#F4F1EC"/>
      <ellipse cx="51" cy="42" rx="2.8" ry="3.5" fill="#F4F1EC"/>
      <path d="M 32 56 Q 37 59 42 56" stroke="#F4F1EC" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <text x="130" y="74" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="48" font-weight="500" fill="#F4F1EC" letter-spacing="-1.2">takeit</text>
</svg>
