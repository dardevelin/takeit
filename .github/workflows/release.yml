name: release

# Publishes to PyPI when a version tag is pushed. Uses PyPI Trusted
# Publishing (OpenID Connect) — no API token in secrets. Configure the
# matching publisher under
# https://pypi.org/manage/account/publishing/ with:
#   PyPI Project Name : takeit
#   Owner             : dardevelin
#   Repository name   : takeit
#   Workflow name     : release.yml
#   Environment name  : pypi

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify with twine
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/takeit
    permissions:
      # Required for Trusted Publishing (OIDC token minting).
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1
