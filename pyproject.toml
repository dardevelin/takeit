[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "takeit"
version = "0.0.1"
description = "Securely transfer files between computers, peer-to-peer, via Nostr-based introduction. No central server."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Darcy Brás da Silva" },
]
keywords = [
    "file-transfer",
    "peer-to-peer",
    "p2p",
    "nostr",
    "spake2",
    "noise-protocol",
    "wormhole",
    "encryption",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: File Sharing",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]
dependencies = [
    "spake2==0.9",
    "pynacl",
    "cryptography",
    "attrs >= 22.2.0",
    "twisted[tls] >= 23.10.0",
    "automat",
    "click",
    "tqdm >= 4.13.0",
    "qrcode >= 8.0",
    "noiseprotocol",
    "nostr-sdk >= 0.44, < 0.45",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-twisted",
    "pytest-asyncio",
    "hypothesis",
    "ruff",
    "pre-commit",
]
publish = [
    "build",
    "twine",
]

[project.scripts]
takeit = "takeit.cli.cli:main"

[project.urls]
Homepage = "https://github.com/dardevelin/takeit"
Source = "https://github.com/dardevelin/takeit"
Issues = "https://github.com/dardevelin/takeit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/takeit"]

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [".automat-visualize"]

[tool.ruff.lint]
# E = pycodestyle errors, F = pyflakes (catches the same things pyflakes
# does, plus more), I = import sorting, W = pycodestyle warnings.
# We can layer in B (bugbear), UP (pyupgrade), SIM (simplify) later once
# the tree is clean and we've decided which idioms to enforce.
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Tests routinely import fixtures whose names appear unused but trigger
# pytest auto-discovery; we don't want F401 to delete them. We rely on
# explicit `_unused = ...` for genuinely-unused locals if needed.
"tests/conftest.py" = ["F401"]
# The dilation modules are largely lifted from upstream wormhole — see
# NOTICE — and we deliberately don't reformat them aggressively in the
# port. Apply only fatal checks (F = real bugs, undef names, etc).
"src/takeit/_dilation/*.py" = ["E", "I", "W"]

[tool.ruff.format]
# Defaults are Black-compatible. quote-style defaults to "double" which
# matches the existing tree.
