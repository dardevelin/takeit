[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "takeit"
version = "0.0.1"
description = "Securely transfer files between computers, peer-to-peer, via Nostr-based introduction."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Darcy Brás da Silva" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: File Sharing",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "spake2==0.9",
    "pynacl",
    "cryptography",
    "attrs >= 22.2.0",
    "twisted[tls] >= 23.10.0",
    "automat",
    "click",
    "humanize",
    "tqdm >= 4.13.0",
    "qrcode >= 8.0",
    "noiseprotocol",
    "nostr-sdk >= 0.44, < 0.45",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-twisted",
    "hypothesis",
    "pyflakes",
    "ruff",
]

[project.scripts]
takeit = "takeit.cli.cli:main"

[project.urls]
Homepage = "https://github.com/dardevelin/takeit"
Source = "https://github.com/dardevelin/takeit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/takeit"]
twisted = true
